<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Samarth 💜</title>
<style>
body{margin:0;font-family:Arial;background:#b57be8;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;text-align:center;overflow:hidden}
.s{display:none;padding:20px}
.a{display:block}
button{padding:12px 25px;font-size:18px;border:none;border-radius:20px;margin:10px}
#yes{background:#fff;color:#8a2be2}
#no{background:#ff4d6d;color:#fff;position:absolute}
</style>
</head>
<body>

<div class="s a"><h1>Heyy Samarth 💜</h1></div>

<div class="s"><h1>I have a little surprise for you ❤️</h1></div>

<div class="s"><h1>I want to ask you something 🥹</h1></div>

<div class="s">
<h1>Would you like to go on a date with me? 💜</h1>
<button id="yes">YES 💜</button>
<button id="no">NO 😅</button>
<p id="msg"></p>
</div>

<script>
const s=document.querySelectorAll(".s");
let i=0;

document.body.onclick=e=>{
if(e.target.tagName=="BUTTON")return;
if(i<3){
s[i].classList.remove("a");
i++;
s[i].classList.add("a");
}
};

const no=document.getElementById("no");
no.onmouseover=no.ontouchstart=()=>{
no.style.left=Math.random()*(innerWidth-100)+"px";
no.style.top=Math.random()*(innerHeight-60)+"px";
};

document.getElementById("yes").onclick=()=>{
document.getElementById("msg").innerHTML="❤️ Yay!! You made me the happiest person! ❤️";
no.style.display="none";
};

</script>

</body>
</html>
