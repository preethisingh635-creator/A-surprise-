<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Samarth 💜</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#7b2cbf,#c77dff,#e0aaff);
overflow:hidden;
}

.container{
text-align:center;
color:white;
padding:20px;
}

h1{
font-size:40px;
margin-bottom:20px;
}

p{
font-size:22px;
margin-bottom:30px;
}

button{
padding:15px 35px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
margin:10px;
transition:0.3s;
}

#yes{
background:#ffffff;
color:#7b2cbf;
}

#no{
background:#ff4d6d;
color:white;
position:absolute;
}

#message{
display:none;
font-size:28px;
margin-top:30px;
font-weight:bold;
}

.heart{
position:absolute;
font-size:24px;
animation:float 4s linear forwards;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-100vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="container">

<h1>Hey Samarth 💜</h1>

<p>Will you go on a date with me?</p>

<button id="yes">YES 💜</button>

<button id="no">NO 😅</button>

<div id="message">
Yay!! 💜<br>
You made me the happiest person! ❤️
</div>

</div>

<script>
  const yes=document.getElementById("yes");
const no=document.getElementById("no");
const message=document.getElementById("message");

no.addEventListener("mouseover",moveButton);
no.addEventListener("touchstart",moveButton);

function moveButton(){

const x=Math.random()*(window.innerWidth-120);
const y=Math.random()*(window.innerHeight-80);

no.style.left=x+"px";
no.style.top=y+"px";

}

yes.addEventListener("click",()=>{

message.style.display="block";

yes.style.display="none";
no.style.display="none";

for(let i=0;i<80;i++){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML=Math.random()>0.5?"💜":"❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.top="100vh";

heart.style.fontSize=(18+Math.random()*25)+"px";

heart.style.animationDuration=(3+Math.random()*2)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000);
  </script>

</body>
</html>

}

});
